<text x="56" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pathology Input</text>
<text x="56" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">UNI2 feature</text>
<text x="56" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">(B, 1536)</text>
