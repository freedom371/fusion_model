  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="36" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Multimodal CMT-CPG Fusion Model</text>
  <rect x="40" y="110" width="220" height="130" rx="18" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
<text x="56" y="138" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">CT Branch Input</text>
<text x="56" y="164" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">3 CT slices as channels</text>
<text x="56" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">(B, 3, 128, 128)</text>
<text x="56" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">max / above / below</text>
