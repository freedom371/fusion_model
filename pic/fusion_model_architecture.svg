<text x="56" y="514" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">11 tabular variables</text>
<text x="56" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">z-score normalized</text>
<rect x="320" y="90" width="250" height="170" rx="18" fill="#e9d5ff" stroke="#1f2937" stroke-width="2"/>
<text x="336" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">CT Encoder</text>
<text x="336" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Swin-Tiny</text>
<text x="336" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">optional SE / CBAM</text>
<text x="336" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">global average pooling</text>
<text x="336" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">projection: 768 -> 16</text>
<rect x="320" y="280" width="250" height="140" rx="18" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>
<text x="336" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pathology Adapter</text>
<text x="336" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Dropout</text>
<text x="336" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Linear 1536 -> 64</text>
<text x="336" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">LayerNorm + ReLU</text>
<rect x="320" y="450" width="250" height="140" rx="18" fill="#fbcfe8" stroke="#1f2937" stroke-width="2"/>
<text x="336" y="478" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Clinical Adapter</text>
<text x="336" y="504" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Dropout</text>
<text x="336" y="526" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Linear 11 -> 12</text>
<text x="336" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">LayerNorm + ReLU</text>
<rect x="640" y="120" width="250" height="120" rx="18" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/>
<text x="656" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Token Projection</text>
<text x="656" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">CT 16 -> 64</text>
<text x="656" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Path 64 -> 64</text>
<text x="656" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Clin 12 -> 64</text>
<rect x="640" y="280" width="250" height="130" rx="18" fill="#c7d2fe" stroke="#1f2937" stroke-width="2"/>
<text x="656" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Token Builder</text>
<text x="656" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">stack 3 modality tokens</text>
<text x="656" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">add learnable modality embedding</text>
<text x="656" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">shape: (B, 3, 64)</text>
<rect x="960" y="180" width="270" height="140" rx="18" fill="#ddd6fe" stroke="#1f2937" stroke-width="2"/>
<text x="976" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Cross-Modal Transformer</text>
<text x="976" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">2 encoder layers</text>
<text x="976" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">4 heads</text>
<text x="976" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">FFN dim 128</text>
<text x="976" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">global self-attention</text>
<rect x="1280" y="120" width="280" height="180" rx="18" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>
<text x="1296" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Clinical-Prior Gating</text>
<text x="1296" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">use clinical token as query</text>
<text x="1296" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">MLP -> 3 gate logits</text>
<text x="1296" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">temperature = exp(log_temperature)</text>
<text x="1296" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">sigmoid(logits / temperature)</text>
<text x="1296" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">gate each modality token</text>
<rect x="1280" y="360" width="280" height="140" rx="18" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/>
<text x="1296" y="388" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Adaptive Aggregation</text>
<text x="1296" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">learnable modality weights</text>
<text x="1296" y="436" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">softmax over 3 modalities</text>
<text x="1296" y="458" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">weighted sum -> fused token</text>
<rect x="1610" y="250" width="230" height="140" rx="18" fill="#fecaca" stroke="#1f2937" stroke-width="2"/>
<text x="1626" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Classifier Head</text>
<text x="1626" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Linear 64 -> 32</text>
<text x="1626" y="326" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">LayerNorm + GELU + Dropout</text>
<text x="1626" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Linear 32 -> 1</text>
