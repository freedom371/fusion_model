<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1220" viewBox="0 0 2000 1220">
<rect width="2000" height="1220" fill="white"/>
<text x="51.00" y="63.50" font-family="Noto Sans CJK SC,sans-serif" font-size="41.67" text-anchor="start" fill="#172B4D" font-weight="700">病理复发预测模型：从 Patch 到患者级概率</text>
<text x="53.00" y="117.00" font-family="Noto Sans CJK SC,sans-serif" font-size="22.22" text-anchor="start" fill="#526277" font-weight="400">UNI2-h 固定特征提取  →  全部 Patch 等权汇总  →  训练集标准化  →  单隐藏层 MLP</text>
<text x="59.00" y="179.25" font-family="Noto Sans CJK SC,sans-serif" font-size="23.61" text-anchor="start" fill="#25734B" font-weight="700">A  离线特征构建｜每位患者使用 N 个病理 Patch，UNI2-h 权重保持固定</text>
<rect x="55.00000000000001" y="216.0" width="405.0" height="366.0" rx="13" fill="#F4F9F6" stroke="#A6C6B3" stroke-width="1.5"/>
<text x="77.00" y="256.25" font-family="Noto Sans CJK SC,sans-serif" font-size="23.61" text-anchor="start" fill="#25734B" font-weight="700">1  Patch 输入与预处理</text>
<rect x="80.0" y="294.0" width="355.0" height="75.0" rx="13" fill="#FFFFFF" stroke="#25734B" stroke-width="1.5"/>
<text x="257.50" y="329.75" font-family="Noto Sans CJK SC,sans-serif" font-size="20.83" text-anchor="middle" fill="#25734B" font-weight="700">患者目录全部 JPG Patch</text>
<text x="257.50" y="381.25" font-family="Noto Sans CJK SC,sans-serif" font-size="18.06" text-anchor="middle" fill="#172B4D" font-weight="400"></text>
<text x="257.50" y="399.00" font-family="Noto Sans CJK SC,sans-serif" font-size="17.78" text-anchor="middle" fill="#172B4D" font-weight="400">RGB → Resize 224×224</text>
<text x="257.50" y="423.72" font-family="Noto Sans CJK SC,sans-serif" font-size="17.78" text-anchor="middle" fill="#172B4D" font-weight="400">像素值 [0,255] → float32 [0,1]</text>
<text x="257.50" y="448.44" font-family="Noto Sans CJK SC,sans-serif" font-size="17.78" text-anchor="middle" fill="#172B4D" font-weight="400">按 ImageNet RGB 均值/标准差归一化</text>
<text x="257.50" y="517.38" font-family="Noto Sans CJK SC,sans-serif" font-size="15.97" text-anchor="middle" fill="#526277" font-weight="400">μ = (0.485, 0.456, 0.406)</text>
<text x="257.50" y="538.90" font-family="Noto Sans CJK SC,sans-serif" font-size="15.97" text-anchor="middle" fill="#526277" font-weight="400">σ = (0.229, 0.224, 0.225)</text>
<polygon points="473.00,389.50 504.85,389.50 504.85,384.00 522.00,395.00 504.85,406.00 504.85,400.50 473.00,400.50" fill="#25734B"/>
<rect x="535.0" y="216.0" width="905.0000000000001" height="366.0" rx="13" fill="#EFF5FD" stroke="#9AB9DC" stroke-width="1.5"/>
<text x="558.00" y="256.25" font-family="Noto Sans CJK SC,sans-serif" font-size="23.61" text-anchor="start" fill="#2666B2" font-weight="700">2  UNI2-h 图像编码器｜输入每个 Patch：(3,224,224)</text>
<rect x="564.0" y="313.0" width="240.0" height="172.0" rx="13" fill="#FFFFFF" stroke="#2666B2" stroke-width="1.5"/>
<text x="684.00" y="348.75" font-family="Noto Sans CJK SC,sans-serif" font-size="20.83" text-anchor="middle" fill="#2666B2" font-weight="700">Patch Embedding</text>
<text x="684.00" y="398.62" font-family="Noto Sans CJK SC,sans-serif" font-size="16.25" text-anchor="middle" fill="#172B4D" font-weight="400">14×14 内部分块</text>
<text x="684.00" y="420.43" font-family="Noto Sans CJK SC,sans-serif" font-size="16.25" text-anchor="middle" fill="#172B4D" font-weight="400">16×16 = 256 个图像 token</text>
<text x="684.00" y="442.24" font-family="Noto Sans CJK SC,sans-serif" font-size="16.25" text-anchor="middle" fill="#172B4D" font-weight="400">嵌入维度：1536</text>
<rect x="848.0" y="313.0" width="304.0" height="172.0" rx="13" fill="#FFFFFF" stroke="#2666B2" stroke-width="1.5"/>
<text x="1000.00" y="348.75" font-family="Noto Sans CJK SC,sans-serif" font-size="20.83" text-anchor="middle" fill="#2666B2" font-weight="700">Transformer ×24</text>
<text x="1000.00" y="399.12" font-family="Noto Sans CJK SC,sans-serif" font-size="16.81" text-anchor="middle" fill="#172B4D" font-weight="400">多头自注意力：24 heads</text>
<text x="1000.00" y="421.49" font-family="Noto Sans CJK SC,sans-serif" font-size="16.81" text-anchor="middle" fill="#172B4D" font-weight="400">FFN：SwiGLU</text>
<text x="1000.00" y="443.85" font-family="Noto Sans CJK SC,sans-serif" font-size="16.81" text-anchor="middle" fill="#172B4D" font-weight="400">残差连接 + LayerNorm</text>
<rect x="1196.0" y="313.0" width="212.0" height="172.0" rx="13" fill="#FFFFFF" stroke="#2666B2" stroke-width="1.5"/>
<text x="1302.00" y="348.75" font-family="Noto Sans CJK SC,sans-serif" font-size="20.83" text-anchor="middle" fill="#2666B2" font-weight="700">输出表示</text>
<text x="1302.00" y="398.75" font-family="Noto Sans CJK SC,sans-serif" font-size="16.39" text-anchor="middle" fill="#172B4D" font-weight="400">LayerNorm</text>
<text x="1302.00" y="420.69" font-family="Noto Sans CJK SC,sans-serif" font-size="16.39" text-anchor="middle" fill="#172B4D" font-weight="400">取 CLS token</text>
<text x="1302.00" y="442.64" font-family="Noto Sans CJK SC,sans-serif" font-size="16.39" text-anchor="middle" fill="#172B4D" font-weight="400">每个 Patch：1536 维</text>
<polygon points="812.00,391.25 830.20,391.25 830.20,387.00 840.00,395.50 830.20,404.00 830.20,399.75 812.00,399.75" fill="#2666B2"/>
<polygon points="1161.00,391.25 1178.55,391.25 1178.55,387.00 1188.00,395.50 1178.55,404.00 1178.55,399.75 1161.00,399.75" fill="#2666B2"/>
<text x="985.50" y="524.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#2666B2" font-weight="400">加入 CLS token、位置嵌入及 8 个 register tokens；按 Patch 分别编码。</text>
<text x="985.50" y="546.22" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#2666B2" font-weight="400">UNI2-h 仅用于特征提取，分类器训练不更新其权重。</text>
<polygon points="1454.00,389.50 1485.85,389.50 1485.85,384.00 1503.00,395.00 1485.85,406.00 1485.85,400.50 1454.00,400.50" fill="#25734B"/>
<rect x="1517.0" y="216.0" width="428.0" height="366.0" rx="13" fill="#F4F9F6" stroke="#A6C6B3" stroke-width="1.5"/>
<text x="1538.00" y="256.25" font-family="Noto Sans CJK SC,sans-serif" font-size="23.61" text-anchor="start" fill="#25734B" font-weight="700">3  Patch → 患者级汇总</text>
<text x="1731.00" y="315.88" font-family="Noto Sans CJK SC,sans-serif" font-size="18.75" text-anchor="middle" fill="#172B4D" font-weight="400">特征矩阵 F ∈ R^(N×1536)</text>
<polygon points="1722.50,346.00 1731.50,346.00 1731.50,368.10 1736.00,368.10 1727.00,380.00 1718.00,368.10 1722.50,368.10" fill="#25734B"/>
<text x="1731.00" y="408.88" font-family="Noto Sans CJK SC,sans-serif" font-size="18.75" text-anchor="middle" fill="#25734B" font-weight="700">每个特征维度等权算术平均</text>
<text x="1731.00" y="433.18" font-family="Noto Sans CJK SC,sans-serif" font-size="18.75" text-anchor="middle" fill="#25734B" font-weight="700">fpatient = (1/N) Σ fi</text>
<polygon points="1722.50,461.00 1731.50,461.00 1731.50,483.10 1736.00,483.10 1727.00,495.00 1718.00,483.10 1722.50,483.10" fill="#25734B"/>
<text x="1731.00" y="523.75" font-family="Noto Sans CJK SC,sans-serif" font-size="20.83" text-anchor="middle" fill="#25734B" font-weight="700">(1,1536) → (1536,)</text>
<polyline points="1730.9999999999998,584.0 1730.9999999999998,633.0 260.0,633.0 260.0,655.0" fill="none" stroke="#25734B" stroke-width="2"/>
<polygon points="255.50,653.00 264.50,653.00 264.50,672.50 269.00,672.50 260.00,683.00 251.00,672.50 255.50,672.50" fill="#25734B"/>
<text x="1016.00" y="616.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#25734B" font-weight="400">每位患者一条固定长度向量；N 随患者变化，输出维度始终为 1536</text>
<text x="59.00" y="720.25" font-family="Noto Sans CJK SC,sans-serif" font-size="23.61" text-anchor="start" fill="#6744A4" font-weight="700">B  患者级训练与预测｜特征标准化后，仅训练 98,433 个 MLP 参数</text>
<rect x="55.00000000000001" y="759.0" width="408.0" height="284.0" rx="13" fill="#F4F9F6" stroke="#A6C6B3" stroke-width="1.5"/>
<text x="79.00" y="798.25" font-family="Noto Sans CJK SC,sans-serif" font-size="23.61" text-anchor="start" fill="#25734B" font-weight="700">4  训练集 z-score</text>
<text x="259.00" y="850.62" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#25734B" font-weight="400">逐维 z = (x − μtrain) / (σtrain + ε)</text>
<text x="259.00" y="874.93" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#25734B" font-weight="400">ε = 1e−8；标准差 ddof=0</text>
<text x="259.00" y="899.24" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#25734B" font-weight="400">仅在训练集患者轴上拟合 μ、σ</text>
<text x="259.00" y="923.54" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#25734B" font-weight="400">train / val / test 共用同一组参数</text>
<text x="259.00" y="947.85" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#25734B" font-weight="400">输出：(B,1536)</text>
<polygon points="473.00,890.25 497.05,890.25 497.05,885.00 510.00,895.50 497.05,906.00 497.05,900.75 473.00,900.75" fill="#6744A4"/>
<rect x="522.0" y="759.0" width="934.0" height="284.0" rx="13" fill="#FCFAFF" stroke="#B39ACF" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="989.00" y="799.25" font-family="Noto Sans CJK SC,sans-serif" font-size="23.61" text-anchor="middle" fill="#6744A4" font-weight="700">5  可训练 MLP 分类器｜一个隐藏层、两个 Linear 层</text>
<rect x="547.0" y="844.9999999999999" width="177.0" height="148.0" rx="13" fill="#FFF3E5" stroke="#B66316" stroke-width="1.5"/>
<text x="635.50" y="880.75" font-family="Noto Sans CJK SC,sans-serif" font-size="20.83" text-anchor="middle" fill="#B66316" font-weight="700">Dropout</text>
<text x="635.50" y="929.75" font-family="Noto Sans CJK SC,sans-serif" font-size="15.28" text-anchor="middle" fill="#172B4D" font-weight="400">p = 0.2；d = Drop(z)</text>
<text x="635.50" y="950.58" font-family="Noto Sans CJK SC,sans-serif" font-size="15.28" text-anchor="middle" fill="#172B4D" font-weight="400">(B,1536)</text>
<text x="635.50" y="971.42" font-family="Noto Sans CJK SC,sans-serif" font-size="15.28" text-anchor="middle" fill="#172B4D" font-weight="400">仅训练时启用</text>
<rect x="767.0" y="844.9999999999999" width="227.99999999999997" height="148.0" rx="13" fill="#F0EBFA" stroke="#6744A4" stroke-width="1.5"/>
<text x="881.00" y="880.75" font-family="Noto Sans CJK SC,sans-serif" font-size="20.83" text-anchor="middle" fill="#6744A4" font-weight="700">Linear 1</text>
<text x="881.00" y="931.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#172B4D" font-weight="400">1536 → 64</text>
<text x="881.00" y="953.22" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#172B4D" font-weight="400">h = W1d + b1</text>
<text x="881.00" y="975.44" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#172B4D" font-weight="400">98,368 个参数</text>
<rect x="1038.0" y="844.9999999999999" width="160.0" height="148.0" rx="13" fill="#F0EBFA" stroke="#6744A4" stroke-width="1.5"/>
<text x="1118.00" y="880.75" font-family="Noto Sans CJK SC,sans-serif" font-size="20.83" text-anchor="middle" fill="#6744A4" font-weight="700">ReLU</text>
<text x="1118.00" y="931.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#172B4D" font-weight="400">a = max(0,h)</text>
<text x="1118.00" y="953.22" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#172B4D" font-weight="400">(B,64)</text>
<text x="1118.00" y="975.44" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#172B4D" font-weight="400">0 个参数</text>
<rect x="1241.0" y="844.9999999999999" width="190.0" height="148.0" rx="13" fill="#F0EBFA" stroke="#6744A4" stroke-width="1.5"/>
<text x="1336.00" y="880.75" font-family="Noto Sans CJK SC,sans-serif" font-size="20.83" text-anchor="middle" fill="#6744A4" font-weight="700">Linear 2</text>
<text x="1336.00" y="931.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#172B4D" font-weight="400">64 → 1</text>
<text x="1336.00" y="953.22" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#172B4D" font-weight="400">s = W2a + b2</text>
<text x="1336.00" y="975.44" font-family="Noto Sans CJK SC,sans-serif" font-size="16.67" text-anchor="middle" fill="#172B4D" font-weight="400">65 个参数</text>
<polygon points="735.00,907.25 748.00,907.25 748.00,903.00 755.00,911.50 748.00,920.00 748.00,915.75 735.00,915.75" fill="#6744A4"/>
<polygon points="1006.00,907.25 1019.00,907.25 1019.00,903.00 1026.00,911.50 1019.00,920.00 1019.00,915.75 1006.00,915.75" fill="#6744A4"/>
<polygon points="1209.00,907.25 1222.00,907.25 1222.00,903.00 1229.00,911.50 1222.00,920.00 1222.00,915.75 1209.00,915.75" fill="#6744A4"/>
<text x="988.00" y="1019.38" font-family="Noto Sans CJK SC,sans-serif" font-size="14.86" text-anchor="middle" fill="#6744A4" font-weight="400">1536 维 → 64 维 → 1 logit；MLP 内无 LayerNorm / BatchNorm，输出层前无第二处 Dropout。</text>
<polygon points="1470.00,890.25 1492.75,890.25 1492.75,885.00 1505.00,895.50 1492.75,906.00 1492.75,900.75 1470.00,900.75" fill="#6744A4"/>
<text x="1487.50" y="856.50" font-family="Noto Sans CJK SC,sans-serif" font-size="13.89" text-anchor="middle" fill="#526277" font-weight="400">logit</text>
<rect x="1517.0" y="759.0" width="428.0" height="284.0" rx="13" fill="#EFF5FD" stroke="#9AB9DC" stroke-width="1.5"/>
<text x="1539.00" y="799.25" font-family="Noto Sans CJK SC,sans-serif" font-size="23.61" text-anchor="start" fill="#2666B2" font-weight="700">6  概率与分类输出</text>
<text x="1731.00" y="856.62" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#2666B2" font-weight="400">Sigmoid：p = 1 / (1 + exp(−s))</text>
<text x="1731.00" y="880.93" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#2666B2" font-weight="400">输出：(B,1)，p ∈ [0,1]</text>
<text x="1731.00" y="905.24" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#2666B2" font-weight="400">p ≥ 0.5：预测复发</text>
<text x="1731.00" y="929.54" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#2666B2" font-weight="400">p &lt; 0.5：预测未复发</text>
<text x="1731.00" y="953.85" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="middle" fill="#2666B2" font-weight="400">推理时关闭 Dropout</text>
<polygon points="1331.50,1052.00 1340.50,1052.00 1340.50,1074.10 1345.00,1074.10 1336.00,1086.00 1327.00,1074.10 1331.50,1074.10" fill="#6744A4"/>
<rect x="1053.0" y="1099.0" width="646.0" height="65.0" rx="13" fill="#FCFAFF" stroke="#B39ACF" stroke-width="1.5"/>
<text x="1376.00" y="1133.25" font-family="Noto Sans CJK SC,sans-serif" font-size="18.06" text-anchor="middle" fill="#6744A4" font-weight="700">训练分支：logit s + 标签 y → BCEWithLogitsLoss</text>
<text x="64.00" y="1105.62" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="start" fill="#526277" font-weight="400">固定的 UNI2-h 特征     →     仅对下游 MLP 反向传播、更新参数</text>
<text x="64.00" y="1129.93" font-family="Noto Sans CJK SC,sans-serif" font-size="17.36" text-anchor="start" fill="#526277" font-weight="400">B：患者批大小；N：单个患者的 Patch 数量。</text>
<text x="64.00" y="1197.12" font-family="Noto Sans CJK SC,sans-serif" font-size="14.58" text-anchor="start" fill="#526277" font-weight="400">图中 14×14 为 UNI2-h 内部 token 分块大小；患者目录中的病理 Patch 是编码器接收的独立图像。</text>
</svg>